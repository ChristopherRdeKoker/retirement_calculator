[package]
name = "retire-calc"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "Document", "Element", "HtmlElement", "DomRect", "EventTarget", "KeyboardEvent", "PointerEvent", "MouseEvent"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
